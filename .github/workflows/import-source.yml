name: Import verified Java source archive

on:
  push:
    paths:
      - '.github/workflows/import-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify archive and restore original Java source files
        shell: bash
        run: |
          set -euo pipefail
          cat _upload_staging/source_part{01..06}.b64 | base64 --decode > /tmp/ict602-source.zip
          echo "047fadd4beaff4889ba0f606d9fc0b58afad5e3c93146632391c28a8316397f9  /tmp/ict602-source.zip" | sha256sum --check -
          unzip -t /tmp/ict602-source.zip
          unzip -oq /tmp/ict602-source.zip
          test "$(find src -type f -name '*.java' | wc -l)" -eq 35

      - name: Check Java 17 compilation
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac --release 17 -encoding UTF-8 -d /tmp/ict602-classes -sourcepath src src/edutech/Main.java
          printf '2\n' | java -cp /tmp/ict602-classes edutech.Main

      - name: Commit source files and remove transfer fragments
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git rm -r _upload_staging
          git diff --cached --quiet && exit 0
          git commit -m "Add 35 verified Java source files"
          git push origin HEAD:main
